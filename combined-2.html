<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gift For You 💝</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{height:100vh;background:linear-gradient(135deg,#ff6fa1,#ff9ecb);display:flex;justify-content:center;align-items:center;overflow:hidden;}
.heart{position:absolute;font-size:24px;animation:float 6s linear infinite;opacity:0.7;z-index:0;}
@keyframes float{from{transform:translateY(100vh);}to{transform:translateY(-10vh);}}
.h1{left:15%;animation-delay:0s;animation-duration:5s;}
.h2{left:35%;animation-delay:2s;animation-duration:7s;}
.h3{left:60%;animation-delay:4s;animation-duration:6s;}
.h4{left:80%;animation-delay:1s;animation-duration:8s;}
.h5{left:50%;animation-delay:3s;animation-duration:6.5s;}
.container{position:relative;z-index:2;background:rgba(255,255,255,0.25);backdrop-filter:blur(12px);padding:50px 40px;border-radius:25px;text-align:center;width:90%;max-width:450px;box-shadow:0 10px 35px rgba(0,0,0,0.25);color:white;}
.main-heart{font-size:60px;animation:beat 1s infinite;margin-bottom:20px;display:block;}
@keyframes beat{0%{transform:scale(1);}50%{transform:scale(1.2);}100%{transform:scale(1);}}
h1{font-size:30px;margin-bottom:15px;}
p{font-size:18px;margin-bottom:30px;opacity:0.9;}
button{background:#ff2f7d;border:none;padding:16px 50px;font-size:20px;border-radius:30px;color:white;cursor:pointer;transition:0.3s;box-shadow:0 5px 15px rgba(0,0,0,0.2);}
button:active{background:#ff0f68;transform:scale(0.95);}
.lyrics{font-size:22px;line-height:1.8;min-height:130px;font-weight:600;}
@keyframes fade{from{opacity:0;transform:translateY(15px);}to{opacity:1;transform:translateY(0);}}
.lyric-animate{animation:fade 0.6s ease;}
.tap-hint{margin-top:20px;font-size:15px;opacity:0.85;letter-spacing:1px;}
.page{display:none;width:100%;}
.page.active{display:block;}
</style>
</head>
<body>

<div class="heart h1">💖</div>
<div class="heart h2">💕</div>
<div class="heart h3">💗</div>
<div class="heart h4">💘</div>
<div class="heart h5">❤️</div>

<!-- PAGE 1 -->
<div class="container page active" id="page1">
  <span class="main-heart">💝</span>
  <h1>Do You Want a Gift?</h1>
  <p>I made this specially for you 💕</p>
  <button id="yesBtn">YES 💖</button>
</div>

  <div class="lyrics" id="lyrics">💗 Wait for magic...</div>
  <div class="tap-hint" id="tapHint">▶️ Screen pe tap karo to start...</div>
</div>

    song.play().catch(function(){
      tapHint.innerText = "▶️ Tap karo to start...";
      started = false;
    });
  }
}

document.getElementById("yesBtn").addEventListener("click", function(){
  page1.classList.remove("active");
  page2.classList.add("active");
  startSong();
});

document.getElementById("page2").addEventListener("click", function(){
  if(song.paused){ startSong(); }
});

song.addEventListener("timeupdate", function(){
  if(lyricsIndex < timedLyrics.length && song.currentTime >= timedLyrics[lyricsIndex].time){
    showLyric(timedLyrics[lyricsIndex].text);
    lyricsIndex++;
  }
});

song.addEventListener("ended", function(){
  lyricsIndex = 0;
  showLyric("💝 The End... Love You!");
});
</script>
</body>
</html>
